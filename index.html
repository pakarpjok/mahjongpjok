<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahjong Connect Duel PJOK</title>
    <style>
        :root {
            --bg-deep-ocean: #030b1e;
            --bg-card: rgba(10, 25, 47, 0.85);
            --primary-glow: #00f2fe;
            --secondary-glow: #4facfe;
            --accent-cyan: #00d2ff;
            --text-light: #e6f1ff;
            --border-glow: rgba(0, 242, 254, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background: radial-gradient(circle at center, #0a2540 0%, #030b1e 100%);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* --- HALAMAN COVER / START SCREEN --- */
        #cover-screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            background: linear-gradient(135deg, rgba(3, 11, 30, 0.85), rgba(10, 37, 64, 0.9)),
                        url('https://raw.githubusercontent.com/pakarpjok/CONTOH/main/cover%20mahjong.png') center/cover no-repeat;
            backdrop-filter: blur(4px);
        }

        .cover-content {
            text-align: center;
            background: rgba(3, 11, 30, 0.75);
            padding: 40px;
            border-radius: 24px;
            border: 1px solid var(--border-glow);
            box-shadow: 0 0 35px rgba(0, 242, 254, 0.25);
            max-width: 90%;
            width: 480px;
        }

        .cover-title {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(90deg, #00f2fe, #4facfe, #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
        }

        .cover-subtitle {
            font-size: 0.95rem;
            color: #8892b0;
            margin-bottom: 30px;
        }

        .btn-futuristic {
            background: linear-gradient(45deg, #00c6ff, #0072ff);
            color: #fff;
            border: none;
            padding: 14px 32px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 198, 255, 0.4);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 8px;
        }

        .btn-futuristic:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.8);
        }

        /* --- HALAMAN PERMAINAN --- */
        #game-screen {
            display: none;
            width: 100vw;
            height: 100vh;
            flex-direction: column;
            padding: 15px;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-card);
            border: 1px solid var(--border-glow);
            padding: 10px 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.1);
        }

        .game-title {
            font-size: 1.2rem;
            color: var(--primary-glow);
            font-weight: bold;
        }

        .arena {
            display: flex;
            flex: 1;
            gap: 20px;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .player-board {
            flex: 1;
            max-width: 500px;
            background: var(--bg-card);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .player-info {
            width: 100%;
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-weight: bold;
            font-size: 0.95rem;
        }

        /* --- GRID ANTI-BUG & FLEXIBLE --- */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(6, 1fr);
            gap: 6px;
            width: 100%;
            aspect-ratio: 1 / 1;
            background: rgba(3, 11, 30, 0.6);
            padding: 8px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .tile {
            background: linear-gradient(145deg, #1e3c72, #2a5298);
            border: 1px solid rgba(0, 242, 254, 0.4);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.8rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: inset 0 0 10px rgba(0, 242, 254, 0.2);
        }

        .tile:hover {
            border-color: var(--primary-glow);
            box-shadow: 0 0 12px var(--primary-glow);
            transform: scale(1.03);
        }

        .tile.selected {
            background: linear-gradient(145deg, #00c6ff, #0072ff);
            border-color: #ffffff;
            box-shadow: 0 0 18px #00f2fe;
        }

        .tile.empty {
            visibility: hidden;
            pointer-events: none;
        }

        .footer-credits {
            text-align: center;
            font-size: 0.8rem;
            color: #8892b0;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- SCREEN 1: COVER -->
    <div id="cover-screen">
        <div class="cover-content">
            <h1 class="cover-title">Mahjong Connect Duel</h1>
            <p class="cover-subtitle">Media Pembelajaran PJOK SD - Futuristic Edition</p>
            <button class="btn-futuristic" onclick="startGame()">BERMAIN (DUEL)</button>
        </div>
    </div>

    <!-- SCREEN 2: GAMEPLAY -->
    <div id="game-screen">
        <div class="header-bar">
            <button class="btn-futuristic" style="padding: 6px 16px; font-size: 0.85rem;" onclick="showCover()">🏠 COVER</button>
            <div class="game-title">MAHJONG CONNECT DUEL PJOK</div>
            <div>🔊</div>
        </div>

        <div class="arena">
            <!-- PLAYER A -->
            <div class="player-board">
                <div class="player-info">
                    <span style="color: #00f2fe;">PEMAIN A</span>
                    <span>❤️ 5 | ⭐ <span id="score-a">0</span></span>
                </div>
                <div id="grid-a" class="grid-container"></div>
            </div>

            <!-- PLAYER B -->
            <div class="player-board">
                <div class="player-info">
                    <span style="color: #00ff88;">PEMAIN B</span>
                    <span>❤️ 5 | ⭐ <span id="score-b">0</span></span>
                </div>
                <div id="grid-b" class="grid-container"></div>
            </div>
        </div>

        <div class="footer-credits">
            Dikembangkan oleh Guru PJOK SD Tuban, Jawa Timur • @pak.arpjok
        </div>
    </div>

    <script>
        const ICONS = ['⚽', '🏀', '🏈', '⚾', '🎾', '🏐'];
        const ROWS = 6;
        const COLS = 6;

        let selectedTileA = null;
        let selectedTileB = null;

        function showCover() {
            document.getElementById('cover-screen').style.display = 'flex';
            document.getElementById('game-screen').style.display = 'none';
        }

        function startGame() {
            document.getElementById('cover-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';
            initGrid('grid-a', 'A');
            initGrid('grid-b', 'B');
        }

        // Generasi Ubin Anti-Bug (Pasti Berpasangan & Genap)
        function generateBalancedBoard() {
            const totalTiles = ROWS * COLS;
            const pairsCount = totalTiles / 2;
            let pool = [];

            for (let i = 0; i < pairsCount; i++) {
                const icon = ICONS[i % ICONS.length];
                pool.push(icon, icon);
            }

            // Shuffle Algoritma Fisher-Yates
            for (let i = pool.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [pool[i], pool[j]] = [pool[j], pool[i]];
            }

            return pool;
        }

        function initGrid(gridId, player) {
            const gridContainer = document.getElementById(gridId);
            gridContainer.innerHTML = '';
            const boardData = generateBalancedBoard();

            boardData.forEach((icon, index) => {
                const tile = document.createElement('div');
                tile.classList.add('tile');
                tile.innerText = icon;
                tile.dataset.index = index;
                tile.dataset.icon = icon;
                tile.addEventListener('click', () => handleTileClick(tile, player));
                gridContainer.appendChild(tile);
            });
        }

        function handleTileClick(tile, player) {
            if (tile.classList.contains('empty')) return;

            let selectedTile = player === 'A' ? selectedTileA : selectedTileB;

            if (!selectedTile) {
                tile.classList.add('selected');
                if (player === 'A') selectedTileA = tile;
                else selectedTileB = tile;
            } else if (selectedTile === tile) {
                tile.classList.remove('selected');
                if (player === 'A') selectedTileA = null;
                else selectedTileB = null;
            } else {
                // Cek Pencocokan (Match)
                if (selectedTile.dataset.icon === tile.dataset.icon) {
                    selectedTile.classList.add('empty');
                    tile.classList.add('empty');
                    
                    let scoreElem = document.getElementById(`score-${player.toLowerCase()}`);
                    scoreElem.innerText = parseInt(scoreElem.innerText) + 10;
                }
                
                selectedTile.classList.remove('selected');
                if (player === 'A') selectedTileA = null;
                else selectedTileB = null;
            }
        }
    </script>
</body>
</html>
